# CLAUDE.md best practices — content, separation, structure. Seeded by 3 parallel
# research agents on 2026-08-28 (source-scout=og-, container-scout=ex-, practitioner-scout=cp-).
# Schema: findings[] of {id, claim, evidence, source_url, confidence, category}.
# Verified 2026-08-28: 12-sample adversarial check, 12/12 held; 3 cosmetic corrections applied.

findings:
- id: og-when-to-add
  claim: Add an instruction to CLAUDE.md only when a concrete trigger occurs — a repeated mistake, a review
    catch, a re-typed correction, or context a new teammate would need.
  evidence: The memory docs list the triggers verbatim - "Claude makes the same mistake a second time",
    "A code review catches something Claude should have known", "You type the same correction ... that
    you typed last session", "A new teammate would need the same context to be productive". Treat CLAUDE.md
    as "the place you write down what you'd otherwise re-explain".
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: evolution
- id: og-facts-not-procedures
  claim: CLAUDE.md holds only facts needed in every session (build commands, conventions, layout, "always
    do X" rules); multi-step procedures and part-of-codebase content belong in a skill or path-scoped
    rule.
  evidence: '"Keep it to facts Claude should hold in every session: build commands, conventions, project
    layout, ''always do X'' rules. If an entry is a multi-step procedure or only matters for one part
    of the codebase, move it to a skill or a path-scoped rule instead."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: content
- id: og-200-line-target
  claim: Target under 200 lines per CLAUDE.md file; longer files reduce adherence.
  evidence: '"Size: target under 200 lines per CLAUDE.md file. Longer files consume more context and reduce
    adherence." The troubleshooting section repeats "Files over 200 lines consume more context and may
    reduce adherence."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: size
- id: og-4mib-hard-cap
  claim: A CLAUDE.md over 4 MiB is skipped entirely; anything under is loaded in full, but shorter files
    produce better adherence.
  evidence: '"Claude Code loads a CLAUDE.md file of up to 4 MiB in full and skips a larger file. Shorter
    files produce better adherence."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: size
- id: og-headers-and-bullets
  claim: Structure CLAUDE.md with markdown headers and bullets grouping related instructions, not dense
    paragraphs.
  evidence: '"Structure: use markdown headers and bullets to group related instructions. Claude scans
    structure the same way readers do: organized sections are easier to follow than dense paragraphs."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: structure
- id: og-verifiable-specificity
  claim: Write instructions concrete enough to verify, e.g. "Use 2-space indentation" not "Format code
    properly".
  evidence: The docs give three explicit pairs - "'Use 2-space indentation' instead of 'Format code properly'",
    "'Run npm test before committing' instead of 'Test your changes'", "'API handlers live in src/api/handlers/'
    instead of 'Keep files organized'".
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: structure
- id: og-consistency-review
  claim: Periodically review CLAUDE.md, nested files, and .claude/rules/ to remove outdated or conflicting
    instructions, because contradictory rules are resolved arbitrarily.
  evidence: '"Consistency: if two rules contradict each other, Claude may pick one arbitrarily. Review
    your CLAUDE.md files, nested CLAUDE.md files in subdirectories, and .claude/rules/ periodically to
    remove outdated or conflicting instructions."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: evolution
- id: og-import-syntax
  claim: CLAUDE.md can import files with @path syntax, relative paths resolving against the containing
    file, recursion capped at four hops, and imports inside backticks/code fences skipped.
  evidence: '"CLAUDE.md files can import additional files using @path/to/import syntax ... maximum depth
    of four hops." "Import parsing skips Markdown code spans and fenced code blocks."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: separation
- id: og-imports-no-token-savings
  claim: Splitting into @imports organizes content but does not reduce context cost, because imported
    files still load at launch; only path-scoped rules actually defer loading.
  evidence: '"You can also split content into imports for organization, though imported files still load
    and enter the context window at launch." And "Splitting into @path imports helps organization but
    doesn''t reduce context ... Use path-scoped rules to load instructions only when Claude works with
    matching files."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: separation
- id: og-scope-hierarchy
  claim: CLAUDE.md content is separated across four scopes — managed policy (org), ~/.claude/CLAUDE.md
    (user), ./CLAUDE.md or ./.claude/CLAUDE.md (project), and gitignored ./CLAUDE.local.md (personal-per-project)
    — loaded broadest first so project instructions appear after user ones.
  evidence: The docs table lists Managed policy / User instructions / Project instructions / Local instructions
    with purposes ("Company coding standards", "Personal preferences for all projects", "Team-shared instructions",
    "Personal project-specific preferences; add to .gitignore"), "in load order, from broadest scope to
    most specific".
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: separation
- id: og-nested-on-demand
  claim: Subdirectory CLAUDE.md files are not loaded at launch; they load on demand when Claude reads
    files in those directories, while ancestor files load at launch and all files concatenate root-down
    rather than overriding.
  evidence: '"Claude also discovers CLAUDE.md ... files in subdirectories under your current working directory.
    Instead of loading them at launch, they are included when Claude reads files in those subdirectories."
    "All discovered files are concatenated into context rather than overriding each other."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: separation
- id: og-rules-dir-topics
  claim: For larger projects, break instructions into .claude/rules/ with one topic per file and a descriptive
    filename (testing.md, api-design.md), optionally scoped to globs via `paths` YAML frontmatter so they
    load only when matching files are touched.
  evidence: '"Each file should cover one topic, with a descriptive filename like testing.md or api-design.md."
    "Rules can be scoped to specific files using YAML frontmatter with the paths field ... only apply
    when Claude is working with files matching the specified patterns." Rules without paths load at launch
    with the same priority as .claude/CLAUDE.md.'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: separation
- id: og-context-not-config
  claim: CLAUDE.md is advisory context, not enforcement — rules that must hold every time belong in hooks
    or settings, not CLAUDE.md.
  evidence: '"Claude treats them as context, not enforced configuration. To block an action regardless
    of what Claude decides, use a PreToolUse hook instead." Also "Settings rules are enforced by the client
    regardless of what Claude decides ... CLAUDE.md instructions shape Claude''s behavior but are not
    a hard enforcement layer."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: anti-pattern
- id: og-html-comments-free
  claim: Block-level HTML comments in CLAUDE.md are stripped before injection, so maintainer-only notes
    can live in the file at zero token cost.
  evidence: '"Block-level HTML comments (<!-- maintainer notes -->) in CLAUDE.md files are stripped before
    the content is injected into Claude''s context. Use them to leave notes for human maintainers without
    spending context tokens on them. Comments inside code blocks are preserved."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: structure
- id: og-doctor-trim-criteria
  claim: The official trim criterion is to cut content Claude can derive from the codebase (directory
    layouts, dependency lists, architecture overviews) and keep pitfalls, rationale, and conventions that
    differ from tool defaults.
  evidence: '"The /doctor checkup proposes trims for a checked-in CLAUDE.md: it cuts content Claude can
    derive from the codebase, such as directory layouts, dependency lists, and architecture overviews,
    and keeps pitfalls, rationale, and conventions that differ from tool defaults."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: evolution
- id: og-init-then-refine
  claim: Bootstrap CLAUDE.md with /init (which discovers build commands, test instructions, conventions
    and reads Cursor/Copilot rule files), then refine with instructions Claude wouldn't discover on its
    own.
  evidence: '"Run /init to generate a starting CLAUDE.md automatically ... If a CLAUDE.md already exists,
    /init suggests improvements rather than overwriting it. Refine from there with instructions Claude
    wouldn''t discover on its own." /init also "reads Cursor rules ... and Copilot rules ... and incorporates
    the relevant parts".'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: evolution
- id: og-agentsmd-bridge
  claim: Claude Code reads CLAUDE.md, not AGENTS.md; the prescribed bridge is a CLAUDE.md containing `@AGENTS.md`
    (optionally plus Claude-specific additions below it) or a symlink.
  evidence: '"Claude Code reads CLAUDE.md, not AGENTS.md. If your repository already uses AGENTS.md for
    other coding agents, create a CLAUDE.md that imports it so both tools read the same instructions without
    duplicating them ... A symlink also works if you don''t need to add Claude-specific content."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: separation
- id: og-include-exclude-table
  claim: Official include list - bash commands Claude can't guess, code-style rules that differ from defaults,
    testing instructions and preferred runners, repository etiquette (branch/PR conventions), project-specific
    architectural decisions, environment quirks (required env vars), and common gotchas/non-obvious behaviors.
  evidence: The best-practices page's Include/Exclude table lists exactly these seven include rows, e.g.
    "Bash commands Claude can't guess", "Repository etiquette (branch naming, PR conventions)", "Common
    gotchas or non-obvious behaviors".
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: content
- id: og-exclude-list
  claim: Official exclude list - anything Claude can figure out by reading code, standard language conventions,
    detailed API documentation (link instead), frequently-changing information, long explanations/tutorials,
    file-by-file codebase descriptions, and self-evident practices like "write clean code".
  evidence: The same table's Exclude column lists "Anything Claude can figure out by reading code", "Detailed
    API documentation (link to docs instead)", "Information that changes frequently", "File-by-file descriptions
    of the codebase", "Self-evident practices like 'write clean code'".
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: anti-pattern
- id: og-removal-test
  claim: Apply a per-line deletion test - keep a line only if removing it would cause Claude to make mistakes.
  evidence: '"Keep it concise. For each line, ask: ''Would removing this cause Claude to make mistakes?''
    If not, cut it. Bloated CLAUDE.md files cause Claude to ignore your actual instructions!"'
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: size
- id: og-no-required-format
  claim: There is no required CLAUDE.md format; the prescription is short, human-readable markdown, with
    example sections like "# Code style" and "# Workflow" containing bullet rules.
  evidence: '"There''s no required format for CLAUDE.md files, but keep it short and human-readable."
    The worked example shows two H1 sections (Code style, Workflow) of terse bullets like "Use ES modules
    (import/export) syntax, not CommonJS (require)".'
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: structure
- id: og-emphasis-sparingly
  claim: Reserve emphasis markers like "IMPORTANT" for the single instruction Claude keeps skipping; emphasizing
    many lines makes none stand out.
  evidence: '"If Claude keeps skipping one instruction, add emphasis such as ''IMPORTANT'' to that line
    alone. If you emphasize many lines, none of them stands out."'
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: structure
- id: og-treat-like-code
  claim: Treat CLAUDE.md like code - check it into git, review it when things go wrong, prune regularly,
    and test edits by observing whether Claude's behavior actually shifts.
  evidence: '"Treat CLAUDE.md like code: review it when things go wrong, prune it regularly, and test
    changes by observing whether Claude''s behavior actually shifts." And "Check CLAUDE.md into git so
    your team can contribute. The file compounds in value over time."'
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: evolution
- id: og-overspec-failure-mode
  claim: The named failure mode of a too-long CLAUDE.md is that Claude ignores half of it; the fix is
    ruthless pruning, deleting rules Claude already follows unprompted or converting them to hooks.
  evidence: '"The over-specified CLAUDE.md. If your CLAUDE.md is too long, Claude ignores half of it because
    important rules get lost in the noise. Fix: Ruthlessly prune. If Claude already does something correctly
    without the instruction, delete it or convert it to a hook." Also "If Claude keeps doing something
    you don''t want despite having a rule against it, the file is probably too long and the rule is getting
    lost."'
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: anti-pattern
- id: og-broad-vs-skills
  claim: Because CLAUDE.md loads every session, include only broadly applicable content; domain knowledge
    or sometimes-relevant workflows go in skills, which load on demand.
  evidence: '"CLAUDE.md is loaded every session, so only include things that apply broadly. For domain
    knowledge or workflows that are only relevant sometimes, use skills instead. Claude loads them on
    demand without bloating every conversation."'
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: separation
- id: og-wrong-twice-trigger
  claim: The graduation trigger into CLAUDE.md is "Claude gets a convention or command wrong twice"; a
    repeated mistake or recurring review comment is a CLAUDE.md edit, not a one-off chat correction.
  evidence: The features-overview trigger table's first row is "Claude gets a convention or command wrong
    twice -> Add it to CLAUDE.md", and "A repeated mistake or a recurring review comment is a CLAUDE.md
    edit, not a one-off correction in chat."
  source_url: https://code.claude.com/docs/en/features-overview
  confidence: high
  category: evolution
- id: og-200-and-split-rule
  claim: Rule of thumb - keep CLAUDE.md under 200 lines, and when it grows, move reference content to
    skills or split into .claude/rules/ files.
  evidence: '"Rule of thumb: Keep CLAUDE.md under 200 lines. If it''s growing, move reference content
    to skills or split into .claude/rules/ files." Repeated in the context-cost tab: "Keep CLAUDE.md under
    200 lines. Move reference material to skills, which load on demand."'
  source_url: https://code.claude.com/docs/en/features-overview
  confidence: high
  category: size
- id: og-additive-specific-wins
  claim: CLAUDE.md files at all levels are additive (never overriding); when instructions conflict, Claude
    reconciles by judgment with more specific instructions typically taking precedence.
  evidence: '"CLAUDE.md files are additive: all levels contribute content to Claude''s context simultaneously
    ... When instructions conflict, Claude uses judgment to reconcile them, with more specific instructions
    typically taking precedence."'
  source_url: https://code.claude.com/docs/en/features-overview
  confidence: high
  category: separation
- id: og-root-file-dilemma
  claim: In a large codebase a single root CLAUDE.md fails one of two ways — it grows to cover every subsystem
    (costing irrelevant context) or stays too generic to be useful — and the fix is layering per-directory
    files.
  evidence: '"a single CLAUDE.md at the repository root tends to either grow to cover every subsystem''s
    conventions, costing context on instructions unrelated to the current task, or stay too generic to
    be useful. Splitting instructions across per-directory files means Claude loads repository-wide rules
    plus only the conventions for the code you''re working in."'
  source_url: https://code.claude.com/docs/en/large-codebases
  confidence: high
  category: anti-pattern
- id: og-two-level-split
  claim: The prescribed monorepo split is two levels - root CLAUDE.md for instructions that apply everywhere
    (coding standards, commit conventions), per-subdirectory CLAUDE.md for that area's stack-specific
    conventions, committed so teammates inherit them and maintained by the directory's owner.
  evidence: '"A common split is two levels: Root CLAUDE.md: instructions that apply everywhere, such as
    coding standards and commit conventions. Per-subdirectory CLAUDE.md: conventions specific to that
    area''s stack ... Commit these files to the repository so teammates inherit them. Each directory''s
    owner typically maintains its file."'
  source_url: https://code.claude.com/docs/en/large-codebases
  confidence: high
  category: separation
- id: og-maintenance-mechanisms
  claim: Keep CLAUDE.md files current via three named mechanisms - review edits in pull requests like
    documentation, revisit after major model releases to delete instructions that worked around older-model
    limitations, and add a Stop hook that reviews the session transcript and proposes CLAUDE.md updates.
  evidence: '"Review in pull requests: treat CLAUDE.md edits like any other documentation change ... Revisit
    after major model releases: instructions that worked around an older model''s limitation may become
    overhead ... Add a Stop hook that proposes updates ... while the gap it exposed is fresh."'
  source_url: https://code.claude.com/docs/en/large-codebases
  confidence: high
  category: evolution
- id: og-centralize-when-layering-fails
  claim: When per-directory CLAUDE.md layering stops scaling (drift, stale files, unowned root), move
    conventions and reference content out of always-loaded CLAUDE.md into on-demand mechanisms - skills,
    centrally-owned plugins, or MCP-exposed code search.
  evidence: '"Per-directory CLAUDE.md files can become hard to govern as the codebase grows. Conventions
    drift, files go stale, and no one owns the root ... Move conventions and reference content out of
    always-loaded CLAUDE.md and into mechanisms that load on demand: Skills ... Plugins ... MCP servers."'
  source_url: https://code.claude.com/docs/en/large-codebases
  confidence: high
  category: separation
- id: og-claudemd-excludes
  claim: In monorepos, the claudeMdExcludes setting (path/glob patterns, settable at any settings scope,
    arrays merging) skips other teams' CLAUDE.md and rules files so they never load; managed-policy CLAUDE.md
    cannot be excluded.
  evidence: '"The claudeMdExcludes setting skips specific files by path or glob pattern so they never
    load. Use this for directories you never work in, such as other teams'' packages, legacy code, or
    vendored subtrees." "Managed policy CLAUDE.md files cannot be excluded."'
  source_url: https://code.claude.com/docs/en/large-codebases
  confidence: high
  category: separation
- id: og-user-message-not-system
  claim: CLAUDE.md content is delivered as a user message after the system prompt (in the SDK, injected
    into the conversation, never the system prompt), which is why compliance is best-effort and instruction
    wording matters.
  evidence: Memory docs - "CLAUDE.md content is delivered as a user message after the system prompt, not
    as part of the system prompt itself ... there's no guarantee of strict compliance, especially for
    vague or conflicting instructions." SDK docs confirm - "the SDK reads it and injects its content into
    the conversation as project context, not into the system prompt."
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: content
- id: og-agentsmd-readme-split
  claim: The AGENTS.md convention prescribes separating agent context from human docs - README stays concise
    for humans (quick starts, project description, contribution guidelines) while the agent file carries
    build steps, tests, and conventions that would clutter a README.
  evidence: 'AGENTS.md is "a README for agents: a dedicated, predictable place to provide the context
    and instructions"; it holds "the extra, sometimes detailed context coding agents need: build steps,
    tests, and conventions that might clutter a README", to "Keep READMEs concise and focused on human
    contributors."'
  source_url: https://agents.md/
  confidence: high
  category: separation
- id: og-agentsmd-freeform
  claim: The cross-tool AGENTS.md standard imposes no schema - it is standard Markdown with any headings
    and no required fields, with suggested sections covering project overview, build/test commands, code
    style, testing, security, and PR/commit guidelines.
  evidence: '"AGENTS.md is just standard Markdown. Use any headings you like; the agent simply parses
    the text you provide." There are "no required fields." Suggested content areas include "Build and
    test commands", "Code style guidelines", "Testing instructions", "Security considerations".'
  source_url: https://agents.md/
  confidence: high
  category: structure
- id: og-agentsmd-nearest-wins
  claim: For monorepos AGENTS.md prescribes one file per package with nearest-file precedence — unlike
    Claude Code's additive concatenation — and explicit user chat prompts overriding everything.
  evidence: '"Place another AGENTS.md inside each package. Agents automatically read the nearest file
    in the directory tree, so the closest one takes precedence." "The closest AGENTS.md to the edited
    file wins; explicit user chat prompts override everything."'
  source_url: https://agents.md/
  confidence: high
  category: separation
- id: og-compaction-directive
  claim: CLAUDE.md can carry compaction-steering instructions (e.g. "When compacting, always preserve
    the full list of modified files and any test commands") so critical context survives summarization,
    and the project-root file itself is re-injected after /compact.
  evidence: 'Best practices - "Customize compaction behavior in CLAUDE.md with instructions like ''When
    compacting, always preserve the full list of modified files and any test commands''". Memory docs
    - "Project-root CLAUDE.md survives compaction: after /compact, Claude re-reads it from disk and re-injects
    it into the session."'
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: content
- id: og-ambiguity-diagnosis
  claim: Official debugging heuristics map symptoms to file defects - Claude ignoring a rule means the
    file is too long; Claude asking questions the file answers means the phrasing is ambiguous.
  evidence: '"If Claude keeps doing something you don''t want despite having a rule against it, the file
    is probably too long and the rule is getting lost. If Claude asks you questions that are answered
    in CLAUDE.md, the phrasing might be ambiguous."'
  source_url: https://code.claude.com/docs/en/best-practices
  confidence: high
  category: evolution
- id: og-local-md-worktrees
  claim: Personal per-project content goes in a gitignored CLAUDE.local.md; to share personal instructions
    across git worktrees, import a home-directory file (e.g. `@~/.claude/my-project-instructions.md`)
    instead, since a gitignored file exists only in the worktree that created it.
  evidence: '"For private per-project preferences that shouldn''t be checked into version control, create
    a CLAUDE.local.md at the project root ... Add CLAUDE.local.md to your .gitignore." "a gitignored CLAUDE.local.md
    only exists in the worktree where you created it. To share personal instructions across worktrees,
    import a file from your home directory instead."'
  source_url: https://code.claude.com/docs/en/memory
  confidence: high
  category: separation
- id: ex-claude-md-symlink-to-agents
  claim: The dominant pattern in large OSS repos is a canonical AGENTS.md with CLAUDE.md reduced to a
    symlink/pointer at it.
  evidence: apache/airflow, ghostty-org/ghostty, vercel/next.js, PostHog/posthog, calcom/cal.com, and
    pydantic/pydantic-ai all commit a 9-byte CLAUDE.md whose content is just the symlink target "AGENTS.md";
    huggingface/transformers points at ".ai/AGENTS.md" and discourse/discourse at "AI-AGENTS.md". The
    AGENTS.md targets carry the real content (airflow 522 lines/35.8KB, PostHog 291 lines/42.4KB).
  source_url: https://github.com/apache/airflow/blob/main/CLAUDE.md
  confidence: high
  category: separation
- id: ex-at-import-stub
  claim: Where a symlink is not used, CLAUDE.md is a one-line "@AGENTS.md" import stub, sometimes with
    a 1-sentence preamble.
  evidence: astral-sh/ruff, astral-sh/uv, getsentry/sentry, rust-lang/rust, elastic/elasticsearch, grafana/grafana,
    block/goose, and n8n-io/n8n each have an 11-byte CLAUDE.md containing exactly "@AGENTS.md"; cloudflare/workers-sdk's
    CLAUDE.md is 5 lines ending "See @AGENTS.md".
  source_url: https://github.com/cloudflare/workers-sdk/blob/main/CLAUDE.md
  confidence: high
  category: separation
- id: ex-size-band
  claim: Real root context files span roughly 25-560 lines (0.7-42KB), with most mature projects landing
    between 100 and 350 lines; none of ~30 sampled top-tier repos keeps a curated root file above ~45KB
    except one outlier.
  evidence: Measured raw files - uv AGENTS.md 25 lines/1.8KB, ghostty 39/1.4KB, sentry 137/7.5KB, temporal
    105/8.5KB, sst/opencode 161/8.7KB, bun CLAUDE.md 240/17.6KB, codex 322/22.5KB, airflow 522/35.8KB,
    next.js 560/30.7KB, PostHog 291/42.4KB.
  source_url: https://github.com/vercel/next.js/blob/canary/AGENTS.md
  confidence: high
  category: size
- id: ex-commands-with-cost-warnings
  claim: Exact build/test commands are the most universal content class, and files annotate commands with
    cost warnings steering agents away from slow full-suite runs.
  evidence: sentry's AGENTS.md command block says "Do not run pytest by itself; it'll take forever!";
    ghostty says prefer -Dtest-filter "because the full test suite is slow"; deno marks "Run all tests
    (this takes a while)". Nearly every sampled file (anthropic-quickstarts, twenty, langchain, bun, deno)
    leads with fenced command blocks.
  source_url: https://github.com/getsentry/sentry/blob/master/AGENTS.md
  confidence: high
  category: content
- id: ex-single-test-invocation
  claim: Files repeatedly document the exact invocation for running ONE test file, as a distinct line
    item from running the suite.
  evidence: anthropics/claude-agent-sdk-python ("python -m pytest tests/test_client.py"), anthropic-quickstarts
    ("pytest tests/path_to_test.py::test_name -v"), twenty ("npx jest path/to/file.spec.ts ... (preferred)"),
    deno, next.js, and langchain all carry a dedicated run-a-specific-test command.
  source_url: https://github.com/anthropics/claude-agent-sdk-python/blob/main/CLAUDE.md
  confidence: high
  category: content
- id: ex-headingless-rule-list
  claim: A viable minimal form is a pure rule list with zero headings, each bullet prefixed by a normative
