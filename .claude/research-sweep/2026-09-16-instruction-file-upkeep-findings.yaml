  - id: claude-md-hierarchy
    name: CLAUDE.md memory hierarchy
    kind: vendor-feature
    origin: Anthropic / Claude Code
    source_url: https://code.claude.com/docs/en/memory
    maintains: Managed-policy CLAUDE.md (/etc/claude-code/CLAUDE.md etc.), ~/.claude/CLAUDE.md, ./CLAUDE.md or ./.claude/CLAUDE.md, ./CLAUDE.local.md, concatenated root-down; `@path` imports (max 4 hops) expand at launch
    write_trigger: manual — user writes the files; Claude edits only when asked ("add this to CLAUDE.md"); `claudeMd` key in managed-settings.json for org-wide content
    staleness_handling: advisory only — docs say "review your CLAUDE.md files ... periodically to remove outdated or conflicting instructions"; `claudeMdExcludes` globs skip irrelevant ancestor files; no automatic detection
    size_control: "\"target under 200 lines per CLAUDE.md file\"; a file up to 4 MiB is loaded in full and a larger file is skipped entirely; imports do not reduce context since imported files load at launch"
    enforcement: advisory — "delivered as a user message after the system prompt, not part of the system prompt"; docs explicitly say hooks/managed settings are the enforcement layer, CLAUDE.md is not
    confidence: high

  - id: claude-code-auto-memory
    name: Auto memory (Claude-written notes)
    kind: vendor-feature
    origin: Anthropic / Claude Code
    source_url: https://code.claude.com/docs/en/memory
    maintains: ~/.claude/projects/<project>/memory/ — a MEMORY.md index plus one topic file per memory, typed `user` / `feedback` / `project` / `reference` in frontmatter; machine-local, shared across worktrees of one repo
    write_trigger: model-written — Claude decides per session what is worth remembering (skips anything derivable from the codebase or already in CLAUDE.md); also on "remember that ..."; on by default, disabled via `autoMemoryEnabled` or CLAUDE_CODE_DISABLE_AUTO_MEMORY=1
    staleness_handling: each written file with frontmatter gets an ISO-8601 `modified` timestamp so age is visible to Claude on read; the over-limit reminder tells Claude to "merge or drop stale entries"; memory files are excluded from the cleanupPeriodDays retention sweep, so nothing expires on its own
    size_control: first 200 lines or 25KB of MEMORY.md, whichever comes first, loads each session; after a write Claude Code measures the file and nudges Claude to shorten it, and if over the limit returns an error telling Claude to rewrite the index; topic files load on demand only
    enforcement: mechanically enforced read limit (the write succeeds but an error is returned and content past the limit is dropped on next load); content itself is advisory
    confidence: high

