name: Validate Marketplace

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jq is preinstalled on ubuntu-latest runners.
      - name: Validate marketplace + plugin manifests
        run: bash scripts/validate-marketplace.sh

      - name: Lint all JSON manifests
        run: |
          find . -path ./node_modules -prune -o -name '*.json' -print \
            | grep -E '\.claude-plugin/(marketplace|plugin)\.json$' \
            | while read -r f; do echo "jq: $f"; jq empty "$f"; done

      # The stdlib-only harnesses — ~100 checks that previously ran only when
      # someone remembered to run make locally. The Playwright/claude-CLI
      # suites (test-canvas, test-ai, test-dashboard) stay local by design.
      - name: skill-linter harness
        run: python3 plugins/skill-linter/scripts/test-harness.py

      - name: evolving-claude-md harness
        run: python3 plugins/evolving-claude-md/skills/evolving-claude-md/test-harness.py

      - name: mindmap-prompt compiler harness
        run: python3 plugins/mindmap-prompt/scripts/test-harness.py

      - name: prompt-coach harness
        run: python3 plugins/prompt-coach/scripts/test-harness.py

      - name: lint every SKILL.md (errors fail; warnings reported)
        run: python3 plugins/skill-linter/scripts/lint_skills.py plugins
